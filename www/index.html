<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Modern Village</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: linear-gradient(135deg, #7A9E7E 0%, #5a7c5f 100%); color: white; text-align: center; -webkit-font-smoothing: antialiased; }
    .wrap { padding: 24px; max-width: 320px; }
    h1 { font-size: 28px; margin: 0 0 12px; font-weight: 700; letter-spacing: -0.02em; }
    p { opacity: 0.85; margin: 0; font-size: 15px; line-height: 1.5; }
    .spinner { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; margin: 18px auto 0; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Modern Village</h1>
    <p>Loading…</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
